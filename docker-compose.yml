version: "3.9"

services:
  minio:
    image: minio/minio:latest
    container_name: arxiv-minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - arxiv-network

  spark-master:
    image: apache/spark:3.5.7-python3
    container_name: arxiv-spark-master
    ports:
      - "8080:8080" # Spark Master Web UI
      - "7077:7077" # Spark Master port
      - "4040:4040" # Spark Application UI
    environment:
      - SPARK_NO_DAEMONIZE=true
      # S3/MinIO configuration
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    volumes:
      - ./data:/data
      - ./src:/opt/spark/work/src
    networks:
      - arxiv-network
    depends_on:
      - minio

  spark-worker-1:
    image: apache/spark:3.5.7-python3
    container_name: arxiv-spark-worker-1
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      # S3/MinIO configuration
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./data:/data
      - ./src:/opt/spark/work/src
    networks:
      - arxiv-network
    depends_on:
      - spark-master

  spark-worker-2:
    image: apache/spark:3.5.7-python3
    container_name: arxiv-spark-worker-2
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      # S3/MinIO configuration
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./data:/data
      - ./src:/opt/spark/work/src
    networks:
      - arxiv-network
    depends_on:
      - spark-master

networks:
  arxiv-network:
    driver: bridge

volumes:
  minio_data:
