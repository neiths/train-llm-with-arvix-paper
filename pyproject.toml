[project]
name = "arxiv-llm-pipeline"
version = "0.1.0"
description = "LLM Training Pipeline with arXiv Data"
requires-python = ">=3.10"
dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    
    # CLI
    "click>=8.0",
    "rich>=13.0",
    
    # arXiv collection
    "arxiv>=2.0",
    "requests>=2.28",
    "aiohttp>=3.8",
    
    # PDF parsing
    "PyMuPDF>=1.23",
    
    # Storage
    "minio>=7.2",
    
    # Processing (add later in Phase 4)
    # "pyspark>=3.5",
    
    # Tokenization
    "sentencepiece>=0.1.99",
    
    # Training
    "torch>=2.0",
    "wandb>=0.16",

    # Spark
    "pyspark>=3.5",
]

[project.scripts]
arxiv-llm = "src.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]